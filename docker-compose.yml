services:
  web:
    build: .
    ports:
      - "3000:3000"
    container_name: rails6_web
    working_dir: /app
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    environment:
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      RUBYOPT: -rlogger
    command: bundle exec rails server -b 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: postgres:16
    container_name: rails6_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rails6_blog_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rails6_blog_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bundle:
  postgres_data: